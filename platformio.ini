[env:esp32s3]
platform = espressif32@6.13.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
# Bootloader fix for XMC D-series flash (see the script header).
extra_scripts = pre:scripts/patch_xmc_bootloader.py
# Embedded text files: must match EMBED_TXTFILES in src/CMakeLists.txt
# (PlatformIO generates the .S stubs from this list).
board_build.embed_txtfiles =
  src/setup_page.html
  twilio/voice.js
# Binary files: must match EMBED_FILES in src/CMakeLists.txt.
board_build.embed_files =
  src/prompts/time_up.pcm
  src/prompts/unavailable.pcm
  src/prompts/no_answer.pcm
  src/prompts/no_wifi.pcm
  src/prompts/not_ready.pcm
