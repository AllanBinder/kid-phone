[env:esp32s3]
platform = espressif32@6.13.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
# Bootloader fix for XMC D-series flash (see the script header).
extra_scripts = pre:scripts/patch_xmc_bootloader.py
# Embedded text files: must match EMBED_TXTFILES in src/CMakeLists.txt
# (PlatformIO generates the .S stubs from this list).
board_build.embed_txtfiles =
  src/setup_page.html
  twilio/voice.js
# Binary files: must match EMBED_FILES in src/CMakeLists.txt.
board_build.embed_files =
  src/prompts/time_up.pcm
  src/prompts/unavailable.pcm
  src/prompts/no_answer.pcm
  src/prompts/no_wifi.pcm
  src/prompts/not_ready.pcm
  src/prompts/cant_call.pcm
  src/prompts/sleep_time.pcm
  src/prompts/secret_start.pcm
  src/prompts/secret_sent.pcm
  src/prompts/time_up_ca.pcm
  src/prompts/unavailable_ca.pcm
  src/prompts/no_answer_ca.pcm
  src/prompts/no_wifi_ca.pcm
  src/prompts/not_ready_ca.pcm
  src/prompts/cant_call_ca.pcm
  src/prompts/sleep_time_ca.pcm
  src/prompts/secret_start_ca.pcm
  src/prompts/secret_sent_ca.pcm
  src/prompts/time_up_es.pcm
  src/prompts/unavailable_es.pcm
  src/prompts/no_answer_es.pcm
  src/prompts/no_wifi_es.pcm
  src/prompts/not_ready_es.pcm
  src/prompts/cant_call_es.pcm
  src/prompts/sleep_time_es.pcm
  src/prompts/secret_start_es.pcm
  src/prompts/secret_sent_es.pcm
  twilio/no_answer.wav
  twilio/no_answer_ca.wav
  twilio/no_answer_es.wav
